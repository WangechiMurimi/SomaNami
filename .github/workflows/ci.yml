name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch makes the older run's result irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Fail on high or critical advisories; moderate ones are left to
      # Dependabot so an unfixable low-risk advisory doesn't block every PR.
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  # Migrations and row-level security tests run against a throwaway local
  # database; nothing here touches the hosted project.
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 3.1.0
      # Only Postgres is needed to apply migrations and run pgTAP.
      - run: supabase db start
      - run: supabase test db

  # Runs the Ollama gateway's real Caddyfile against a mock Ollama (#151).
  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CADDY_VERSION: 2.10.0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # Pinned and checksum-verified, so the test runs the Caddy we expect.
      - name: Install Caddy
        run: |
          base="https://github.com/caddyserver/caddy/releases/download/v${CADDY_VERSION}"
          archive="caddy_${CADDY_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "$base/$archive"
          curl -fsSLO "$base/caddy_${CADDY_VERSION}_checksums.txt"
          grep " ${archive}\$" "caddy_${CADDY_VERSION}_checksums.txt" | sha512sum -c -
          tar -xzf "$archive" caddy
          sudo install caddy /usr/local/bin/caddy
          caddy version
      - run: npm run test:gateway

  # Runs the VM's idle-deallocate script against fixture logs and a mock
  # IMDS/ARM (#201).
  vm-idle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm run test:idle
