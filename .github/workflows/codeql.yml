name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  # Weekly, so new CodeQL queries also scan code that hasn't changed.
  schedule:
    - cron: '20 14 * * 1'

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      # JavaScript and TypeScript are analysed from source; no build needed.
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
