version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # One PR for routine minor and patch bumps keeps review load low; majors
    # and security fixes still arrive as their own PRs.
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    # typescript-eslint supports only typescript <6.1, and a newer major breaks
    # `npm ci`. Lift this once typescript-eslint supports the next major.
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
