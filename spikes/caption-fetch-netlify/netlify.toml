# Standalone throwaway site for the #59 spike, deployed from this folder only.
# It must not share a site with the app: it has no build and no secrets.
[build]
  publish = "public"

# Without this, `netlify dev` detects the app's Vite setup in the parent folder
# and stops to ask which framework to run.
[dev]
  framework = "#static"
  port = 8888

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
