# Netlify serves the Vite build as static files and the API as Functions.
# Chat answers come from our self-hosted Ollama (#149, #152). Set in the site's
# environment variables, never exposed to the browser:
# - OLLAMA_BASE_URL: the HTTPS address of the Ollama gateway (#151). Without it,
#   chat answers 503 not-configured.
# - OLLAMA_API_KEY: the gateway's key, sent as a bearer token. A secret.
# - OLLAMA_MODEL (optional, default qwen2.5:3b) and OLLAMA_TIMEOUT_MS
#   (optional, default 7000; keep it at least 3 s under the 10 s function
#   limit, or the function is cut off before it can answer 504).
# - AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET (a secret) and
#   AZURE_VM_RESOURCE_ID (the VM's full ARM id): the waker identity printed by
#   infra/azure/create-waker.sh (#201). With all four set, a chat that finds the
#   VM asleep starts it and answers 503 model-waking; the client waits and
#   resends. The identity can only read and start that one VM. Leave all four
#   unset to turn waking off. Scope them to Functions.
# - LLM_PROVIDER: leave unset (ollama). Claude is for local development only:
#   with CONTEXT=production the server refuses to build it, so learners'
#   passages never reach a third party. Don't set ANTHROPIC_API_KEY here.
# Auth (#114) also needs, in the same place:
# - VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY, VITE_TURNSTILE_SITE_KEY:
#   public, baked into the browser bundle at build time.
# - SUPABASE_URL (optional; falls back to VITE_SUPABASE_URL): the Functions
#   verify session tokens against this project's keys. With neither set, every
#   chat request is refused with 503 not-configured.
# - SUPABASE_PUBLISHABLE_KEY (optional; falls back to
#   VITE_SUPABASE_PUBLISHABLE_KEY): the chat Function loads the learner's
#   materials with it and the learner's own token, so RLS applies (#148).
#   Without it, chat answers 503 not-configured. Never a secret key.
# Functions: chat.ts (/api/chat), health.ts (/api/health) and fetch-link.ts
# (/api/fetch-link, #93), which fetches a learner's link server-side and
# returns the raw bytes for the browser to parse. It is same-origin, so the
# CSP below needs no new connect-src; its outbound requests are not subject to
# CSP. Its rate limit lives in the function's `config`, like chat's.
[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Client-side routes (/library, /chat/...) are served the app shell. API paths
# are claimed by Netlify Functions first, so this never shadows /api/*.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers for every static response. Netlify does not add these to
# Function responses (/api/*); those set their own.
#
# CSP notes, one per non-'self' source:
# - challenges.cloudflare.com: Turnstile's script and its challenge iframe.
# - fonts.googleapis.com / fonts.gstatic.com: the Inter and Manjari webfonts
#   imported at the top of src/index.css.
# - img-src data: blob:: pdf.js draws some page parts from generated data: and
#   blob: images.
# - wocfeftbiqmozhbqcojw.supabase.co: this project's Supabase (Auth, the
#   profiles table and, from #143, storage) over HTTPS, and nothing else. A new
#   Supabase project must be named here, or the browser can't reach it.
# - worker-src 'self' blob:: the pdf.js worker is a same-origin file; blob:
#   covers libraries that start workers from generated code.
# - No 'unsafe-inline' anywhere. The theme script is public/theme-init.js, Vite
#   emits CSS as files, and React and pdf.js set styles through the CSSOM,
#   which style-src does not restrict.
# The value is one line: each line below ends in "\", which TOML joins.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = """\
      default-src 'self'; \
      script-src 'self' https://challenges.cloudflare.com; \
      style-src 'self' https://fonts.googleapis.com; \
      font-src 'self' https://fonts.gstatic.com; \
      img-src 'self' data: blob:; \
      connect-src 'self' https://wocfeftbiqmozhbqcojw.supabase.co; \
      frame-src https://challenges.cloudflare.com; \
      worker-src 'self' blob:; \
      object-src 'none'; \
      base-uri 'self'; \
      form-action 'self'; \
      frame-ancestors 'none'\
      """
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Cross-Origin-Opener-Policy = "same-origin"
